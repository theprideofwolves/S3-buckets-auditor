name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o dist/s3-auditor${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Packaged onboarding smoke test
        run: python .github/scripts/smoke.py s3-auditor dist/s3-auditor${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: s3-auditor-${{ runner.os }}
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Package portable executables
        run: |
          mkdir -p release
          for os in windows linux; do
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "package-$os"
            GOOS=$os GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "package-$os/s3-auditor$ext" .
            go version -m "package-$os/s3-auditor$ext" > "package-$os/dependencies.txt"
            cp README.md RELEASE.md architecture.md interviewprep.md explaining-each-decision-taken-over-others.md permissions.json "package-$os/"
            (cd "package-$os" && zip -r "../release/s3-auditor-$os-x64.zip" .)
          done
          (cd release && sha256sum *.zip > SHA256SUMS)
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "S3 Auditor $tag" --notes-file RELEASE.md
