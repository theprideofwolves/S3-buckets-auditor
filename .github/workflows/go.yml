name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Offline tests, coverage and synthetic measurements
        run: python .github/scripts/measure.py --output dist/results
      - name: Build portable executable
        run: go build -trimpath -o dist/s3-auditor${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Publish readable job summary
        if: always()
        shell: bash
        run: |
          if [ -f dist/results/README.md ]; then
            cat dist/results/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-auditor-${{ runner.os }}
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Package portable executables
        run: |
          mkdir -p release
          for os in windows linux; do
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "package-$os"
            GOOS=$os GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "package-$os/s3-auditor$ext" .
            go version -m "package-$os/s3-auditor$ext" > "package-$os/dependencies.txt"
            cp README.md RELEASE.md architecture.md interviewprep.md explaining-each-decision-taken-over-others.md permissions.json "package-$os/"
            cp -r docs "package-$os/"
            mkdir -p "package-$os/testdata"
            cp testdata/demo.json "package-$os/testdata/"
            (cd "package-$os" && zip -r "../release/s3-auditor-$os-x64.zip" .)
          done
          (cd release && sha256sum *.zip > SHA256SUMS)
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "S3 Auditor $tag" --notes-file RELEASE.md
